[project]
name = "agent-lbw"
version = "0.1.0"
description = "Look both ways. Plans a change, builds it, and holds the merge until the goal is met."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Henry Hollenstain" }]
dependencies = [
    "lbw-shared",
    "openai>=1.60",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "typer>=0.15",
    "rich>=13.9",
    "cryptography>=44",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "playwright>=1.49",
    "mempalace>=3.10",
    "docker>=7.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]
browser = [
    "playwright>=1.49",
]

[project.scripts]
lbw = "agent_lbw.cli:app"

[tool.uv.workspace]
members = ["libs/lbw_shared", "services/crossing"]

[tool.uv.sources]
lbw-shared = { workspace = true }

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_lbw = ["templates/*.html", "static/*.css", "static/*.svg", "templates/Dockerfile.sandbox", "skills/*/SKILL.md", "roles/*/ROLE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "libs/lbw_shared/src", "services/crossing/src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "libs", "services"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
