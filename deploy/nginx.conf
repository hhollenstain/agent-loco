worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    resolver 127.0.0.11 ipv6=off valid=10s;

    server {
        listen 80;
        server_name www-local.lookbothways.dev crossing-local.lookbothways.dev local.lookbothways.dev;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name www-local.lookbothways.dev local.lookbothways.dev;
        ssl_certificate /certs/server.crt;
        ssl_certificate_key /certs/server.key;

        location /api/events/stream {
            set $lbw_agent http://agent:8080;
            proxy_pass $lbw_agent;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        location /crossingguard {
            set $lbw_crossing http://crossing:8080;
            proxy_pass $lbw_crossing;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/crossingguard {
            set $lbw_crossing http://crossing:8080;
            proxy_pass $lbw_crossing;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            set $lbw_agent http://agent:8080;
            proxy_pass $lbw_agent;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    server {
        listen 443 ssl;
        server_name crossing-local.lookbothways.dev;
        ssl_certificate /certs/server.crt;
        ssl_certificate_key /certs/server.key;

        location / {
            set $lbw_crossing http://crossing:8080;
            proxy_pass $lbw_crossing;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
