# Apple Silicon / Docker Desktop: the Linux VM cannot use Metal.
# Run Ollama on the Mac host, then point the container at it.
services:
  agent:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LBW_MODEL_BASE_URL: ${LBW_MODEL_BASE_URL:-http://host.docker.internal:11434/v1}
      LBW_MODEL_NAME: ${LBW_MODEL_NAME:-qwen2.5-coder:14b}
      LBW_KIWIFS_URL: ${LBW_KIWIFS_URL:-http://host.docker.internal:3333}
